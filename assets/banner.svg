<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f0fdf4" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="url(#gridGrad)" stroke-width="0.8" />
      <circle cx="36" cy="36" r="1.2" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow1 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.18) translate(30px, -20px); opacity: 0.6; }
    }
    @keyframes pulseGlow2 {
      0%, 100% { transform: scale(1.1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(0.92) translate(-25px, 20px); opacity: 0.55; }
    }
    @keyframes floatBrowser {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1.2deg); }
    }
    @keyframes floatDevTools {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-1.5deg); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -160; }
    }
    @keyframes radarPulse {
      0% { r: 6; opacity: 0.9; }
      100% { r: 24; opacity: 0; }
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes badgeFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes badgeFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes badgeFloat3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambience (Behind everything) -->
  <g>
    <circle cx="200" cy="90" r="190" fill="#06b6d4" opacity="0.35" filter="url(#glow)" style="animation: pulseGlow1 8s ease-in-out infinite;" />
    <circle cx="1020" cy="180" r="230" fill="#6366f1" opacity="0.3" filter="url(#glow)" style="animation: pulseGlow2 9s ease-in-out infinite;" />
    <circle cx="680" cy="340" r="170" fill="#a855f7" opacity="0.25" filter="url(#glow)" style="animation: pulseGlow1 11s ease-in-out infinite reverse;" />
  </g>

  <!-- High-Tech Geometric Grid Overlay -->
  <rect width="1200" height="420" fill="url(#techGrid)" opacity="0.8" rx="16" />

  <!-- Animated Data Conduits &amp; Wave Lines -->
  <g opacity="0.55">
    <path d="M 0 110 Q 300 170 600 120 T 1200 140" fill="none" stroke="url(#neonCyanPurple)" stroke-width="2" stroke-dasharray="10 14" style="animation: beamFlow 14s linear infinite;" />
    <path d="M 0 310 Q 350 250 720 310 T 1200 280" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="8 12" opacity="0.4" style="animation: beamFlow 18s linear infinite reverse;" />
    <path d="M 0 210 Q 400 290 850 190 T 1200 230" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.35" style="animation: beamFlow 20s linear infinite;" />
  </g>

  <!-- Dynamic Right-Side Graphic: Interactive Live Browser Windows &amp; Device Sandbox -->
  <g transform="translate(820, 80)">
    <!-- Browser Window Card 1 (Main Chrome / Blink Viewport) -->
    <g style="animation: floatBrowser 7s ease-in-out infinite;">
      <!-- Window Shadow -->
      <rect x="0" y="0" width="330" height="210" rx="12" fill="#000000" opacity="0.45" />
      <!-- Window Body -->
      <rect x="0" y="0" width="330" height="210" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#subtleGlow)" />
      
      <!-- Window Header Bar -->
      <rect x="0" y="0" width="330" height="34" rx="12" fill="#1e293b" opacity="0.95" />
      <rect x="0" y="24" width="330" height="10" fill="#1e293b" opacity="0.95" />
      <!-- Window Control Dots -->
      <circle cx="16" cy="17" r="4.5" fill="#ef4444" />
      <circle cx="30" cy="17" r="4.5" fill="#eab308" />
      <circle cx="44" cy="17" r="4.5" fill="#22c55e" />
      
      <!-- URL Omnibar -->
      <rect x="62" y="8" width="180" height="18" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="72" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">https://app.localhost:3000</text>
      <!-- Live Status Pill -->
      <rect x="250" y="9" width="68" height="16" rx="8" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="0.8" />
      <circle cx="260" cy="17" r="3" fill="#10b981" />
      <text x="268" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#34d399">● LIVE 60fps</text>

      <!-- Webpage Viewport Content Mockup -->
      <g transform="translate(18, 48)">
        <!-- Hero Box -->
        <rect x="0" y="0" width="294" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <rect x="12" y="10" width="120" height="8" rx="4" fill="#38bdf8" opacity="0.9" />
        <rect x="12" y="23" width="180" height="6" rx="3" fill="#64748b" opacity="0.7" />
        <rect x="235" y="10" width="45" height="20" rx="5" fill="#3b82f6" />
        <text x="244" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">RUN</text>

        <!-- Grid of Testing Viewport Cards -->
        <g transform="translate(0, 48)">
          <rect x="0" y="0" width="90" height="52" rx="5" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
          <circle cx="15" cy="15" r="5" fill="#38bdf8" opacity="0.8" />
          <text x="26" y="18" font-family="sans-serif" font-size="8" font-weight="bold" fill="#e2e8f0">Chromium</text>
          <rect x="10" y="28" width="70" height="4" rx="2" fill="#475569" />
          <rect x="10" y="36" width="45" height="4" rx="2" fill="#22c55e" />

          <rect x="102" y="0" width="90" height="52" rx="5" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
          <circle cx="117" cy="15" r="5" fill="#f97316" opacity="0.8" />
          <text x="128" y="18" font-family="sans-serif" font-size="8" font-weight="bold" fill="#e2e8f0">Firefox</text>
          <rect x="112" y="28" width="70" height="4" rx="2" fill="#475569" />
          <rect x="112" y="36" width="55" height="4" rx="2" fill="#22c55e" />

          <rect x="204" y="0" width="90" height="52" rx="5" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
          <circle cx="219" cy="15" r="5" fill="#0284c7" opacity="0.8" />
          <text x="230" y="18" font-family="sans-serif" font-size="8" font-weight="bold" fill="#e2e8f0">WebKit</text>
          <rect x="214" y="28" width="70" height="4" rx="2" fill="#475569" />
          <rect x="214" y="36" width="60" height="4" rx="2" fill="#22c55e" />
        </g>

        <!-- Simulated Touch / Click Pointer with Pulse Radar -->
        <g transform="translate(145, 75)">
          <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" style="animation: radarPulse 2s ease-out infinite;" />
          <circle cx="0" cy="0" r="4" fill="#38bdf8" />
        </g>

        <!-- Interactive Remote Console Bar -->
        <rect x="0" y="110" width="294" height="38" rx="5" fill="#090d16" stroke="#1e293b" stroke-width="0.8" />
        <text x="10" y="125" font-family="'Consolas', monospace" font-size="8.5" fill="#34d399">> RemoteWebRTC::streamConnected(60fps)</text>
        <text x="10" y="138" font-family="'Consolas', monospace" font-size="8.5" fill="#38bdf8">> DOM::dispatchMouseEvent(click, x=482, y=312) <tspan style="animation: cursorBlink 1s infinite;" fill="#ffffff">_</tspan></text>
      </g>
    </g>

    <!-- Floating Mobile Device Overlay (Real Device / Emulator) -->
    <g transform="translate(185, 100)" style="animation: floatDevTools 6s ease-in-out infinite;">
      <rect x="0" y="0" width="130" height="215" rx="18" fill="#020617" stroke="#818cf8" stroke-width="1.8" filter="url(#glow)" />
      <!-- Notch / Camera -->
      <rect x="42" y="6" width="46" height="7" rx="3.5" fill="#1e293b" />
      <circle cx="78" cy="9.5" r="1.5" fill="#38bdf8" />
      <!-- Screen Screen Viewport -->
      <rect x="7" y="18" width="116" height="182" rx="10" fill="#0f172a" />
      <!-- Header -->
      <rect x="14" y="26" width="55" height="6" rx="3" fill="#38bdf8" />
      <circle cx="108" cy="29" r="3" fill="#22c55e" />
      <!-- Card Image -->
      <rect x="14" y="38" width="102" height="48" rx="6" fill="#1e293b" />
      <rect x="20" y="46" width="60" height="5" rx="2.5" fill="#93c5fd" />
      <rect x="20" y="55" width="80" height="4" rx="2" fill="#64748b" />
      <rect x="20" y="63" width="70" height="4" rx="2" fill="#64748b" />
      <rect x="20" y="73" width="30" height="8" rx="3" fill="#ec4899" />
      <!-- Multi-row simulated layout -->
      <rect x="14" y="93" width="102" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5" />
      <rect x="20" y="101" width="50" height="5" rx="2" fill="#cbd5e1" />
      <rect x="14" y="120" width="102" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5" />
      <rect x="20" y="128" width="65" height="5" rx="2" fill="#cbd5e1" />
      <!-- Mobile Safari / Chrome Bottom Bar -->
      <rect x="7" y="174" width="116" height="26" rx="5" fill="#020617" />
      <circle cx="24" cy="187" r="4" fill="#64748b" />
      <circle cx="44" cy="187" r="4" fill="#64748b" />
      <rect x="58" y="180" width="45" height="14" rx="4" fill="#1e293b" />
      <text x="64" y="190" font-family="sans-serif" font-size="7" fill="#94a3b8">mobile/safari</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed Visible &amp; Crisp (Left Side) -->
  <g transform="translate(60, 68)">
    <!-- Category Pill Badge -->
    <g>
      <rect x="0" y="0" width="340" height="30" rx="15" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" filter="url(#subtleGlow)" />
      <circle cx="16" cy="15" r="4.5" fill="#06b6d4">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.2">CURATED QUALITY ASSURANCE DIRECTORY</text>
    </g>

    <!-- Main Title (Double layered for high contrast and glow) -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">Awesome Live Interactive</text>
      <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">Cross-Browser Testing 🌐⚡</text>
    </g>

    <!-- Subtitle (Clear, high legibility foreground text) -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
        Real-Time Manual Browser Grids • WebRTC Remote Browser Sandboxes
      </text>
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.1">
        Self-Hosted Docker Fleets &amp; Commercial Real-Device Cloud Platforms
      </text>
    </g>

    <!-- Floating Interactive Technology Badges (Foreground) -->
    <g transform="translate(0, 230)">
      <!-- Badge 1: WebRTC &amp; VNC Stream -->
      <g style="animation: badgeFloat1 5s ease-in-out infinite;">
        <rect x="0" y="0" width="168" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">⚡ WebRTC &amp; VNC</text>
      </g>

      <!-- Badge 2: Multi-Engine Coverage -->
      <g transform="translate(180, 0)" style="animation: badgeFloat2 6s ease-in-out infinite;">
        <rect x="0" y="0" width="202" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" />
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">🌐 Blink • WebKit • Gecko</text>
      </g>

      <!-- Badge 3: Docker &amp; Cloud Farms -->
      <g transform="translate(394, 0)" style="animation: badgeFloat3 5.5s ease-in-out infinite;">
        <rect x="0" y="0" width="186" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" />
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">🐳 Self-Hosted &amp; Cloud</text>
      </g>
    </g>
  </g>

  <!-- Outer Neon Border Framing -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#neonCyanPurple)" stroke-width="1.5" opacity="0.6" />
</svg>
